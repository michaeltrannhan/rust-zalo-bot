# Example non-secret configuration for zl-expense.
# Credential values live in /etc/zl-expense/credentials/ (referenced by name only).

[server]
listen_address = "127.0.0.1:8080"

[database]
url_credential = "database"
max_connections = 5

[concurrency]
receipt_extraction = 1
outbound_delivery = 4

[retention]
original_receipt_days = 7

[credentials]
directory = "/etc/zl-expense/credentials"

[access]
# Empty is fail-closed: no provider identity may create or use an account.
allowed_provider_sender_ids = []

[zalo]
bot_token_credential = "zalo-bot"
webhook_secret_credential = "webhook-secret"
api_base = "https://bot-api.zaloplatforms.com"
send_timeout_seconds = 10
webhook_max_body_bytes = 1048576
