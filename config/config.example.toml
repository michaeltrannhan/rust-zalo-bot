# Example non-secret configuration for zl-expense.
# Credential values live in /etc/zl-expense/credentials/ (referenced by name only).

[server]
listen_address = "127.0.0.1:8080"

[database]
url_credential = "database"
max_connections = 5

[concurrency]
receipt_extraction = 1
outbound_delivery = 4

[retention]
original_receipt_days = 7

[quotas]
per_user_daily_receipts = 20
monthly_extraction_pages = 80
zalo_monthly_messages = 3000
monthly_insight_narratives = 30

[insights]
llm_enabled = false

[features]
extraction_enabled = true
outbound_enabled = true

[metrics]
enabled = false
# bind is ignored when /metrics is served on the main HTTP listener
bind = "127.0.0.1:9090"

[update]
public_keys_directory = "/etc/zl-expense/update-keys"
install_path = "/usr/bin/zl-expense"
state_directory = "/var/lib/zl-expense/update"

[credentials]
directory = "/etc/zl-expense/credentials"

[access]
# Empty is fail-closed: no provider identity may create or use an account.
allowed_provider_sender_ids = []

[storage]
backend = "filesystem"
directory = "/var/lib/zl-expense/objects"
# Optional S3/MinIO (set backend = "s3"):
# endpoint = "https://minio.example.internal"
# bucket = "zl-expense"
# region = "us-east-1"
# access_key_credential = "s3-access-key"
# secret_key_credential = "s3-secret-key"
# force_path_style = true

[extraction]
backend = "gemini"
default_profile = "receipt-fast"
api_base = "https://generativelanguage.googleapis.com"

[[ai.profiles]]
name = "receipt-fast"
provider = "gemini"
model = "gemini-3.6-flash"
credential = "gemini-receipt-fast"
task = "extraction"
timeout_seconds = 90
max_input_bytes = 4194304
max_output_tokens = 8192
thinking_effort = "high"
schema_version = "v1"

[zalo]
bot_token_credential = "zalo-bot"
webhook_secret_credential = "webhook-secret"
api_base = "https://bot-api.zaloplatforms.com"
send_timeout_seconds = 10
webhook_max_body_bytes = 1048576
