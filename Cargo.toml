[package]
name = "zl-expense"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.0"
description = "Privacy-conscious self-hosted Zalo expense bot"
license = "MIT OR Apache-2.0"

[lib]
name = "zl_expense"
path = "src/lib.rs"

[[bin]]
name = "zl-expense"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["json", "tokio", "http1"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
chrono-tz = "0.10"
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio-rustls",
    "postgres",
    "migrate",
    "macros",
    "uuid",
    "chrono",
] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "sync"] }
toml = "0.8"
tower = { version = "0.5", default-features = false }
tower-http = { version = "0.6", default-features = false, features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = [
    "fmt",
    "env-filter",
    "ansi",
] }
hex = "0.4"
hmac = "0.12"
base64 = { version = "0.22", default-features = false, features = ["alloc"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
imagesize = "0.15"
sha2 = { version = "0.10", default-features = false }
subtle = "2"
unicode-normalization = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
ed25519-dalek = { version = "2.1", default-features = false, features = ["std", "alloc"] }
sd-notify = "0.4"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio-rustls",
    "postgres",
] }
