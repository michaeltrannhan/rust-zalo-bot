# Development PostgreSQL 16 profile for zl-expense.
# Binds the database port to the host loopback interface only.

services:
  postgres:
    image: postgres:16-bookworm
    container_name: zl-expense-postgres-dev
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: zl_expense
      POSTGRES_PASSWORD: zl_expense_dev
      POSTGRES_DB: zl_expense
    volumes:
      - zl_expense_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zl_expense -d zl_expense"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  zl_expense_pg_data:
