name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    concurrency:
      group: ci-test-${{ github.ref }}
      cancel-in-progress: true
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: zl_expense
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d zl_expense"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/zl_expense
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --all-targets --all-features
      - name: Security audit
        run: ./scripts/security-audit.sh
      - name: Slot deploy helpers
        run: ./scripts/test-slot-deploy.sh
      - name: Package layout
        run: ./scripts/test-package.sh
